<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Freeday — picker states on the raw path</title>
<link rel="stylesheet" href="../../dist/freeday.bundle.css">
<script src="../../dist/freeday.js" defer></script>
</head>
<body>
  <!-- The three field states the CSS always styled and the enhancers never set. Each control
       appears plain, then disabled, then readonly, then invalid, so the plain one proves the
       fixture works before the others prove anything about state. -->

  <div id="dpPlain" data-fdy-datepicker data-label="Plain date"></div>
  <div id="dpDisabled" data-fdy-datepicker data-label="Disabled date" data-disabled></div>
  <div id="dpReadonly" data-fdy-datepicker data-label="Readonly date" data-readonly data-value="2026-08-25"></div>
  <div id="dpInvalid" data-fdy-datepicker data-label="Invalid date" data-invalid></div>

  <!-- Label overrides: until 2.1.1 these ten strings were literals passed to a helper, so no
       consumer on the raw path — every Blazor app included — could rename any of them. -->
  <div id="dpText" data-fdy-datepicker data-label="Tanggal"
       data-fdy-text-prev-month="Bulan sebelumnya" data-fdy-text-next-month="Bulan berikutnya"></div>

  <div id="csPlain" data-fdy-cascade data-label="Plain area">
    <ul><li data-value="a">Alpha<ul><li data-value="a1">Alpha one</li></ul></li></ul>
  </div>
  <div id="csReadonly" data-fdy-cascade data-label="Readonly area" data-readonly>
    <ul><li data-value="b">Beta<ul><li data-value="b1">Beta one</li></ul></li></ul>
  </div>

  <script>
    window.stateOf = function (id) {
      var root = document.getElementById(id);
      var trigger = root.querySelector('button');
      var panel = root.querySelector('.fdy-datepicker__panel, .fdy-cascade__panel');
      return {
        disabled: trigger.disabled,
        readonly: trigger.getAttribute('aria-readonly'),
        invalid: trigger.getAttribute('aria-invalid'),
        errorClass: /--error/.test(root.className),
        panelHidden: panel ? panel.hidden : null
      };
    };
    window.navLabels = function (id) {
      var btns = document.getElementById(id).querySelectorAll('.fdy-cal__nav');
      return Array.prototype.map.call(btns, function (b) { return b.getAttribute('aria-label'); });
    };
  </script>
</body>
</html>
