<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Freeday — bottom navigation</title>
<link rel="stylesheet" href="../../dist/freeday.bundle.css">
</head>
<body>

      <a class="fdy-bottomnav__item" id="item2" href="#">
        <span class="fdy-bottomnav__icon">▤</span>

        <span class="fdy-bottomnav__icon">▥</span>

</body>
</html>
