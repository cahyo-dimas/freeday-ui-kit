<!doctype html>
<html lang="en" data-theme="light">
<meta charset="utf-8">
<title>Freeday — document columns with side rails</title>
<link rel="stylesheet" href="../../dist/freeday.bundle.css">
<style>body { margin: 0; padding: 24px; } .tall { height: 3000px; } .taller-than-screen { height: 1600px; }</style>
<body>
  <div class="fdy-page">
    <div class="fdy-page__columns" id="cols">
      <div class="fdy-page__lead" id="lead"><div class="fdy-card"><div class="fdy-card__body">Record</div></div></div>
      <div class="fdy-page__main" id="main"><div class="fdy-card tall"><div class="fdy-card__body">Sections</div></div></div>
      <div class="fdy-page__aside" id="aside"><div class="fdy-card taller-than-screen"><div class="fdy-card__body">Summary</div></div></div>
    </div>
  </div>
</body>
</html>
