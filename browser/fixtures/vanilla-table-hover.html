<!doctype html>
<html lang="en" data-theme="light">
<meta charset="utf-8">
<title>Freeday — only actionable rows answer the pointer</title>
<link rel="stylesheet" href="../../dist/freeday.bundle.css">
<style>body { padding: 40px; } td { padding: 8px 12px; }</style>
<body>
  <span id="probe-hover" style="background:var(--color-surface-2)">probe</span>
  <span id="probe-surface" style="background:var(--color-surface)">probe</span>

  <table class="fdy-table fdy-table--striped fdy-table--hover-actionable" id="opt">
    <tbody>
      <tr id="inert-odd"><td>Inert, odd</td></tr>
      <tr id="inert-even"><td>Inert, even (striped)</td></tr>
      <tr id="act" class="fdy-table__row--activatable" tabindex="0"><td>Opens the record</td></tr>
    </tbody>
  </table>

  <div class="fdy-table-scroll" style="margin-top:24px">
    <table class="fdy-table fdy-table--sticky fdy-table--hover-actionable" id="frozen">
      <tbody><tr id="frozen-row"><td class="fdy-table__freeze" id="freeze-cell">Frozen</td><td>Scrolls</td></tr></tbody>
    </table>
  </div>

  <table class="fdy-table" id="plain" style="margin-top:24px">
    <tbody><tr id="plain-row"><td>No modifier: unchanged</td></tr></tbody>
  </table>
  <div id="away" style="height:40px;margin-top:24px">away</div>
</body>
</html>
