# Publishes @cahyo-dimas/freeday to the public npm registry when a version tag is pushed.
# Auth = OIDC Trusted Publishing (no stored token — the 2FA-bypassing tokens npm is
# restricting are avoided entirely). Prereqs (one-time): (1) own the npm scope `cahyo-dimas`;
# (2) on npmjs.com set this repo + workflow file (publish.yml) as the package's Trusted
# Publisher. Release: `npm version <patch|minor|major>` (builds + stages dist), then
# `git push --follow-tags`; this workflow builds, tests, and publishes.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  # Both suites, from ci.yml, so a tag whose guards are red never reaches npm. Called rather than
  # copied: a second copy of the step list is a second thing to keep in sync, and the copy that
  # matters is the one running at release time.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # npm@11 needs Node ^20.17 || >=22.9; latest npm dropped Node 20
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@^11.5.1 # trusted publishing needs npm >= 11.5.1; pin the 11.x line so a future npm major can't break CI
      - run: npm ci
      - run: node tokens/build.mjs
      - run: npm publish # OIDC trusted publishing: no token, provenance automatic

